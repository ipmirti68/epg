<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mırtı TV v73 Dual Player - Patron Mod</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#070b14;color:#e8e6df;font-family:Arial,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{height:38px;background:#0f1726;display:flex;align-items:center;justify-content:space-between;padding:0 8px;border-bottom:1px solid #1e2a44;flex-shrink:0}
.logo{display:flex;align-items:center;gap:6px;font-weight:900;font-size:13px}
.logo img{height:26px;width:26px;object-fit:cover;border-radius:5px}
.top{background:#0d1525;display:flex;flex-wrap:nowrap;gap:4px;align-items:center;padding:5px 6px;border-bottom:1px solid #1c2b4a;flex-shrink:0;overflow:auto}
.top button{border:1px solid #1e2a44;color:#5a6a8a;background:#0f1726;padding:5px 10px;border-radius:14px;font-size:12px;font-weight:800;white-space:nowrap;cursor:pointer;display:flex;align-items:center;gap:4px;flex-shrink:0;opacity:0.6;transition:all 0.2s}
.top button.on{opacity:1;color:#fff;box-shadow:0 0 8px rgba(0,0,0,.4)}
.top button[data-tab="live"].on{background:#ff3b30;border-color:#ff3b30}
.top button[data-tab="movie"].on{background:#007aff;border-color:#007aff}
.top button[data-tab="series"].on{background:#af52de;border-color:#af52de}
.top button[data-tab="radio"].on{background:#ff9500;border-color:#ff9500;color:#111}
.top button[data-tab="fav"].on{background:#ffcc00;border-color:#ffcc00;color:#111}
#playerCol{height:36vh;min-height:180px;max-height:36vh;background:#000;position:relative;display:flex;flex-direction:column;flex-shrink:0}
#playerCol.fullscreen{height:100vh;min-height:100vh;max-height:100vh;position:fixed;inset:0;z-index:80;background:#000}
#player{flex:1;position:relative;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
#video,#framePlayer{width:100%;height:100%;object-fit:contain;background:#000;z-index:2}
#framePlayer{border:0;display:none}
#idle{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000}
#idle img{width:100%;height:100%;object-fit:cover;display:block}
#fsBtn{position:absolute;top:8px;right:8px;z-index:10;background:rgba(0,0,0,.6);color:#fff;border:1px solid rgba(255,255,255,.3);width:28px;height:28px;border-radius:6px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#epgBar{height:24px;background:#101c33;padding:2px 8px;font-size:10px;font-weight:600;border-top:1px solid #1c2b4a;display:flex;align-items:center;flex-shrink:0}
#groupsWrap{height:34px;background:#0b1320;border-bottom:1px solid #1c2b4a;display:flex;align-items:center;padding:0 3px;gap:3px;flex-shrink:0}
#groups{flex:1;display:flex;gap:4px;overflow:auto}
.gChip{padding:3px 9px;background:#101c33;border:1px solid #1e2f52;border-radius:10px;font-size:11px;white-space:nowrap;cursor:pointer}
.gChip.on{background:#d4b78f;color:#111;font-weight:800}
#list{flex:1;background:#080d16;display:flex;flex-direction:column;overflow:hidden;min-height:0}
#grid.live{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:5px;grid-auto-rows:68px}
#grid.poster{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:5px;grid-auto-rows:280px}
#grid.radioGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px;grid-auto-rows:110px}
.item{position:relative;display:flex;align-items:center;gap:6px;background:#13203a;border:1px solid #1e2e51;border-radius:8px;padding:4px 6px;cursor:pointer;height:68px;overflow:hidden}
.item.on{border-color:#d4b78f;box-shadow:0 0 6px rgba(212,183,143,.25)}
.logoBox{width:42px;height:42px;min-width:42px;background:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.logoBox img{width:100%;height:100%;object-fit:contain}
.info{flex:1;overflow:hidden;min-width:0;display:flex;flex-direction:column;justify-content:center}
.info b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .epg1{font-size:10px;color:#c8d8ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hidden{display:none!important}
</style>
</head>
<body>
<header><div class="logo"><img src="https://raw.githubusercontent.com/ipmirti68/-ptv-/refs/heads/main/IMG-20261025-WA5328.jpg">Mırtı TV v73 DUAL</div><div style="display:flex;gap:4px"><button id="setBtn" style="background:#d4b78f;color:#111;border:none;padding:3px 8px;border-radius:4px;font-weight:800;font-size:10px">AYAR</button></div></header>
<div class="top"><button data-tab="live" class="on" id="bLive">📺 Canlı</button><button data-tab="movie" id="bMovie">🎬 Film</button><button data-tab="series" id="bSeries">🎞️ Dizi</button><button data-tab="radio" id="bRadio">📻 Radyo</button><button data-tab="fav" id="bFav">⭐ Fav</button></div>
<div id="playerCol"><div id="player">
<video id="video" controls playsinline preload="metadata" style="display:none"></video>
<iframe id="framePlayer" allowfullscreen></iframe>
<audio id="audioEl"></audio>
<div id="idle"><img id="idleImg" src="https://raw.githubusercontent.com/ipmirti68/-ptv-/refs/heads/main/IMG-20261017-WA0045.jpg"></div>
<button id="fsBtn">⛶</button>
</div><div id="epgBar"><span id="epgNow">Hazır...</span></div></div>
<div id="groupsWrap"><div id="groups"></div></div>
<div id="list"><div id="grid" class="live"></div></div>

<script>
// SENİN AYARLARIN AYNI KALIYOR
var M3U_FILES=["mırtı68.m3u","mirti68.m3u"];
var M3U_BASES=["https://raw.githubusercontent.com/ipmirti68/-p/main/","https://raw.githubusercontent.com/ipmirti68/-p/refs/heads/main/"];
var M3U_URLS=[]; for(var bi=0;bi<M3U_BASES.length;bi++){ for(var fi=0;fi<M3U_FILES.length;fi++){ M3U_URLS.push(M3U_BASES[bi]+encodeURIComponent(M3U_FILES[fi])); } }
var EPG_URL="https://raw.githubusercontent.com/ipmirti68/epg/refs/heads/main/epg.xml";
var DEFAULT_LOGO="https://raw.githubusercontent.com/ipmirti68/-ptv-/refs/heads/main/IMG-20261025-WA5328.jpg";

var channels=[],epg={},curGroup=null,curTab="live",hls=null,hlsAudio=null,groupOrder=[],favs=[],curCh=null;
try{favs=JSON.parse(localStorage.getItem("mirti_fav")||"[]");}catch(e){favs=[];}
function $(id){return document.getElementById(id);}
function norm(s){ if(!s)return ""; return s.toLowerCase().replace(/ı/g,"i").replace(/ş/g,"s").replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ö/g,"o").replace(/ç/g,"c"); }

function getTypeByGroup(g,url){
  var n=norm(g);
  if(n.indexOf("radyo")!=-1) return "radio";
  if(n.indexOf("film")!=-1 || n.indexOf("movie")!=-1) return "movie";
  if(n.indexOf("dizi")!=-1 || n.indexOf("series")!=-1) return "series";
  return "live";
}
function parseM3U(t){
  var list=[]; t=t.replace(/\r/g,""); var lines=t.split("\n"); var cur=null; var seen={}; groupOrder=[];
  for(var i=0;i<lines.length;i++){
    var l=lines[i].trim(); if(!l)continue;
    if(l.toUpperCase().indexOf("#EXTINF")==0){
      cur={}; var lo=l.match(/tvg-logo="([^"]+)"/i); if(lo)cur.logo=lo[1];
      var gr=l.match(/group-title="([^"]+)"/i); cur.group=gr?gr[1].trim():"Genel";
      var c=l.lastIndexOf(","); cur.title=c!=-1?l.slice(c+1).trim():"Kanal "+(list.length+1);
      if(!seen[cur.group]){seen[cur.group]=1; groupOrder.push(cur.group);}
    }else if(cur && l.charAt(0)!="#"){
      cur.url=l.split("|")[0].trim(); cur.type=getTypeByGroup(cur.group,cur.url); list.push(cur); cur=null;
    }
  }
  return list;
}

// *** YENİ DUAL PLAYER MANTIĞI ***
function play(ch){
  curCh=ch;
  var v=$("video"), f=$("framePlayer"), a=$("audioEl"), idle=$("idle");
  if(hls){try{hls.destroy()}catch(e){} hls=null;}
  if(hlsAudio){try{hlsAudio.destroy()}catch(e){} hlsAudio=null;}
  a.pause(); v.pause();
  
  // RADYO
  if(ch.type=="radio"){
    idle.style.display="none"; f.style.display="none"; v.style.display="none"; a.style.display="block";
    $("epgNow").textContent="📻 "+ch.title;
    if(ch.url.includes(".m3u8") && Hls.isSupported()){
      hlsAudio=new Hls(); hlsAudio.loadSource(ch.url); hlsAudio.attachMedia(a); hlsAudio.on(Hls.Events.MANIFEST_PARSED,function(){a.play()});
    } else { a.src=ch.url; a.play(); }
    renderGrid(); return;
  }

  // IFRAME mi HLS mi? - İŞTE FARK
  var isIframe = ch.url.includes("trend48") || ch.url.includes("live-tv") || ch.url.includes(".html") || ch.url.includes("fixbet") || !ch.url.includes(".m3u8") && !ch.url.includes(".mp4") && ch.url.startsWith("http") && ch.type=="live" && false;
  // Otomatik karar: .m3u8, .mp4, .mp3 dışındakiler iframe denenecek
  
  if(ch.url.indexOf(".m3u8")>-1 || ch.url.indexOf(".mp4")>-1){
    // HLS MODE
    idle.style.display="none"; f.style.display="none"; f.src="about:blank"; v.style.display="block";
    $("epgNow").textContent=ch.title+" | "+ch.group;
    if(ch.url.indexOf(".m3u8")>-1 && Hls.isSupported()){
      hls=new Hls(); hls.loadSource(ch.url); hls.attachMedia(v); hls.on(Hls.Events.MANIFEST_PARSED,function(){v.play()});
    } else { v.src=ch.url; v.play(); }
  } else {
    // IFRAME MODE - VIP için
    idle.style.display="none"; v.style.display="none"; f.style.display="block";
    $("epgNow").textContent="🌐 IFRAME: "+ch.title;
    f.src=ch.url;
  }
  renderGrid();
}

function getFiltered(){ var list=[]; for(var i=0;i<channels.length;i++){ if(curTab=="fav"){if(favs.indexOf(channels[i].url)!=-1)list.push(channels[i]);} else if(channels[i].type==curTab)list.push(channels[i]); } if(curGroup){ var f=[]; for(var j=0;j<list.length;j++) if(list[j].group==curGroup)f.push(list[j]); list=f; } return list; }
function renderGroups(){ var gl=$("groups"); gl.innerHTML=""; for(var i=0;i<groupOrder.length;i++){ var g=groupOrder[i]; var has=false; for(var j=0;j<channels.length;j++){ if(channels[j].group==g && (curTab=="fav"?favs.indexOf(channels[j].url)!=-1:channels[j].type==curTab)){has=true;break;}} if(!has)continue; var div=document.createElement("div"); div.className="gChip"+(g==curGroup?" on":""); div.textContent=g; div.onclick=(function(gg){return function(){curGroup=gg; renderGrid(); renderGroups();};})(g); gl.appendChild(div);} }
function renderGrid(){ var grid=$("grid"); grid.innerHTML=""; var list=getFiltered(); grid.className="live"; for(var j2=0;j2<list.length;j2++){ var ch2b=list[j2]; var row2=document.createElement("div"); row2.className="item"+(curCh && curCh.url==ch2b.url?" on":""); var logoBox2=document.createElement("div"); logoBox2.className="logoBox"; var img2b=document.createElement("img"); img2b.src=ch2b.logo||DEFAULT_LOGO; img2b.onerror=function(){this.src=DEFAULT_LOGO}; logoBox2.appendChild(img2b); var info=document.createElement("div"); info.className="info"; var b2=document.createElement("b"); b2.textContent=ch2b.title; var s=document.createElement("div"); s.className="epg1"; s.textContent=ch2b.group; info.appendChild(b2); info.appendChild(s); row2.appendChild(logoBox2); row2.appendChild(info); row2.onclick=(function(c){return function(){play(c);};})(ch2b); grid.appendChild(row2);} }

function loadM3UFromUrls(idx){ if(idx>=M3U_URLS.length){ $("epgNow").textContent="Liste yüklenemedi"; return; } fetch(M3U_URLS[idx]).then(function(r){return r.text()}).then(function(t){ channels=parseM3U(t); curGroup=groupOrder[0]; renderGroups(); renderGrid(); $("epgNow").textContent=channels.length+" kanal - v73 DUAL"; }).catch(function(){loadM3UFromUrls(idx+1)}) }

function init(){
  var tabs=document.querySelectorAll(".top button");
  for(var i=0;i<tabs.length;i++){ tabs[i].addEventListener("click",(function(btn){return function(){ var newTab=btn.dataset.tab; for(var j=0;j<tabs.length;j++)tabs[j].classList.remove("on"); btn.classList.add("on"); curTab=newTab; curGroup=null; renderGroups(); renderGrid(); };})(tabs[i])); }
  $("fsBtn").onclick=function(){ var pc=$("playerCol"); pc.classList.toggle("fullscreen"); };
  loadM3UFromUrls(0);
}
init();
</script>
</body>
</html>
