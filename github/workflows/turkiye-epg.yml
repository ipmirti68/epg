name: Turkiye EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * *"

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: EPG birlestir
        run: python scripts/merge_epg.py

      - name: XMLTV kontrol
        run: |
          python -c "import xml.etree.ElementTree as ET; r=ET.parse('epg.xml').getroot(); print('Kanallar:',len(r.findall('channel'))); print('Programlar:',len(r.findall('programme'))); assert r.tag == 'tv' and len(r.findall('programme')) > 0"

      - name: EPG kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg.xml
          if ! git diff --cached --quiet; then
            git commit -m "Turkiye EPG guncellemesi"
            git push
          else
            echo "Yeni degisiklik yok"
          fi
