
name: Türkiye EPG Günlük Birleştirme

on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * *"

permissions:
  contents: write

concurrency:
  group: turkiye-epg
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: EPG kaynaklarını birleştir
        run: python scripts/merge_epg.py

      - name: XMLTV dosyasını kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg.xml
          if ! git diff --cached --quiet; then
            git commit -m "Günlük Türkiye EPG güncellemesi"
            git push
          fi
          
